<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Quest</title>
<style>
:root{--bg:#14102a;--c:#201a40;--ink:#f4f1ff;--m:#a79fd0;--p:#ff4fa3;--l:#c6ff3d;--r:#ff6b6b}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
#app{max-width:900px;margin:auto;padding:12px 12px 90px}
.c{background:var(--c);border-radius:16px;padding:14px;margin:0 0 10px}
button,input,textarea,select{font:inherit;border-radius:12px;border:0;padding:9px 12px;margin:2px 0}
button{cursor:pointer;background:var(--l);color:#14102a;font-weight:700}button.a{background:#3a3170;color:var(--ink)}
input,textarea,select{background:#2a2350;color:var(--ink);width:100%}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);padding:6px}
nav button{flex:1;margin:0 3px;background:none;color:var(--m)}nav button.on{background:var(--p);color:#fff}
#yt,#vid{width:100%;aspect-ratio:16/9;border-radius:14px;background:#000}
.ln{padding:8px;border-radius:10px;cursor:pointer}.ln.on{background:#3a2a6a;outline:2px solid var(--p)}
.act{display:none;margin-top:6px}.ln.on .act{display:block}
.w:hover{background:#4de1ff44;border-radius:4px}.m{color:var(--m);font-size:13px}
.ok{background:#27401f!important}.no{background:#451f2a!important}
#pop{position:fixed;left:8px;right:8px;bottom:64px;max-height:55vh;overflow:auto;border:2px solid var(--p);z-index:5;max-width:880px;margin:auto}
h2,h3{margin:4px 0}
</style></head><body><div id="app">
<div class="c">⚡ XP: <b id="xp">0</b> · English Quest <button class="a" style="float:right" onclick="settings()">⚙️ ИИ</button></div>
<section id="watch">
 <div class="c"><input id="url" placeholder="Ссылка на YouTube"><button onclick="ytLoad()">▶ Загрузить видео</button>
 <div class="m">Или свои файлы. Видео: <input type="file" id="fv" accept="video/*"> Субтитры .srt/.vtt: <input type="file" id="fs" accept=".srt,.vtt,.txt"></div>
 <textarea id="paste" rows="3" placeholder="Или вставь текст: субтитры, статью, главу книги"></textarea><button class="a" onclick="usePaste()">Разобрать текст</button><div class="m">Как получить субтитры: на YouTube «Ещё» → «Посмотреть расшифровку», скопируй всё и вставь сюда. Дальше: тап по слову = перевод · ▶ реплика · 🔁 цикл · 🎤 повтори за героем · 🇷🇺 перевод строки · 🧠 разбор в Claude.</div></div>
 <div id="stk" style="position:sticky;top:0;z-index:3;background:var(--bg)"><div id="stage"></div>
 <div class="c" id="ctl" hidden><div id="cap" style="font-size:19px;line-height:1.4;min-height:28px;margin-bottom:6px"></div>Скорость: <select id="sp" style="width:auto" onchange="rate(+this.value)"><option value="0.5">0.5</option><option value="0.75">0.75</option><option value="1" selected>1</option></select>
 </div></div>
 <div id="tr"></div>
</section>
<section id="gram" hidden></section><section id="deck" hidden></section><section id="chat" hidden></section>
</div>
<div id="pop" class="c" hidden><button class="a" style="float:right" onclick="$('#pop').hidden=true">✕</button><div id="pb"></div></div>
<nav><button data-t="watch">🎬 Смотреть</button><button data-t="gram">🧠 Грамматика</button><button data-t="deck">🃏 Слова</button><button data-t="chat">💬 Чат</button></nav>
<script>
const $=s=>document.querySelector(s),G=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
let S=G('eq')||{xp:0,deck:{},les:{}};S.deck=S.deck||{};S.les=S.les||{};
const sv=()=>{try{localStorage.setItem('eq',JSON.stringify(S))}catch(e){}};
const gain=n=>{S.xp+=n;sv();$('#xp').textContent=S.xp};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const norm=s=>s.toLowerCase().replace(/[^a-z' ]/g,'').replace(/\s+/g,' ').trim();
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const dec=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
const mic=cb=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('Для речи нужен Chrome или Edge');const r=new R();r.lang='en-US';r.onresult=e=>cb(e.results[0][0].transcript);r.onerror=()=>pop('Не расслышала, попробуй ещё раз');r.start()};
async function ai(system,messages){const P=G('prov')||{p:'gemini',k:'',m:''};
 if(!P.k)throw new Error('Для этого раздела нужен ИИ. Он работает в версии внутри Claude: claude.ai/artifact/2wgGBqHKTaHM7t9Gbi7a5f')
 let r,d;
 if(P.p=='gemini'){r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+(P.m||'gemini-flash-latest')+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':P.k},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:messages.map(m=>({role:m.role=='user'?'user':'model',parts:[{text:m.content}]}))})});
  d=await r.json();if(d.error)throw new Error(d.error.message);return d.candidates[0].content.parts.map(p=>p.text||'').join('')}
 if(!P.m){settings();throw new Error('Для OpenRouter укажи модель с :free в названии')}
 r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+P.k},body:JSON.stringify({model:P.m,messages:[{role:'system',content:system},...messages]})});
 d=await r.json();if(d.error)throw new Error(d.error.message||'ошибка модели');return d.choices[0].message.content}
function settings(){const P=G('prov')||{p:'gemini',k:'',m:''};pop(`<h3>⚙️ Бесплатный ИИ</h3><select id="sp1"><option value="gemini" ${P.p=='gemini'?'selected':''}>Google Gemini (бесплатный ключ)</option><option value="or" ${P.p=='or'?'selected':''}>OpenRouter (бесплатные модели)</option></select><input id="sk" placeholder="API-ключ" value="${esc(P.k)}"><input id="sm" placeholder="Модель (для Gemini можно пусто)" value="${esc(P.m)}"><button onclick="saveS()">Сохранить</button><div class="m">Gemini: aistudio.google.com → Get API key. OpenRouter: openrouter.ai → Keys, а модель бери с :free в названии. Ключ хранится только в твоём браузере.</div>`)}
function saveS(){localStorage.setItem('prov',JSON.stringify({p:$('#sp1').value,k:$('#sk').value.trim(),m:$('#sm').value.trim()}));$('#pop').hidden=true}
const TS='Ты сильный репетитор английского для русскоговорящей ученицы уровня A2. Отвечай по-русски, понятно, подробно, без воды. Всегда объясняй ПОЧЕМУ. Английские примеры давай с переводом.';
const WS=TS+' Дай: перевод В ЭТОМ КОНТЕКСТЕ, часть речи, транскрипцию, формы (если глагол), 2 коротких примера, как слово звучит в живой речи.';
const ES=TS+' Разбери строку из видео или книги: 1) перевод по смыслу, 2) ключевые слова, 3) грамматика: какое время или конструкция и ПОЧЕМУ так сказано, 4) произношение: связки, редукции, ударение (подсказки кириллицей), 5) как сказать иначе, 6) один вопрос для проверки.';
const CS='Ты Алекс, дружелюбный носитель английского, 22 года, любишь indie и pop. Общаешься с русскоязычной ученицей A2: пиши 1-3 простых предложения и задай один встречный вопрос. Потом блок «✏️ Разбор»: если в её последнем сообщении есть ошибки, дай исправленный вариант и ПО-РУССКИ объясни почему (правило); если ошибок нет, похвали и предложи более естественный вариант. Если она пишет по-русски, переведи и покажи, как сказать по-английски.';
const GS='Ты сильный репетитор английского. Ученица русскоговорящая, уровень A2. Верни ТОЛЬКО JSON без пояснений: {"rule":"подробное объяснение по-русски, 300-450 слов: 1) когда используем, 2) формулы (утверждение, вопрос, отрицание), 3) секреты и исключения, 4) сравнение с русским, 5) сигнальные слова; **жирный** для главного, \\n для абзацев","examples":[["английское предложение","перевод"]],"mistakes":["частая ошибка русскоговорящих и как правильно"],"quiz":[{"q":"вопрос с ___","opts":["","",""],"a":0,"why":"объяснение по-русски"}]}. examples: 6 штук про музыку, сериалы, соцсети. mistakes: 4. quiz: 7 вопросов, последний на тему «почему так?».';
const TOP=['to be','Present Simple','Present Continuous','Past Simple','Past Continuous','Present Perfect','Present Perfect Continuous','Past Perfect','Будущее: will / going to','Модальные глаголы','Сравнительная и превосходная степень','Артикли a / an / the','Предлоги','Исчисляемые и неисчисляемые','Вопросы и порядок слов','Пассивный залог','Условные 0 и 1','Условные 2 и 3','Герундий и инфинитив','Косвенная речь','Относительные придаточные','Фразовые глаголы'];
/* вкладки */
function go(t){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));['watch','gram','deck','chat'].forEach(x=>$('#'+x).hidden=x!=t);if(t=='gram')gramHome();if(t=='deck')deckShow();if(t=='chat'&&!$('#cl'))chatInit()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
function pop(h){$('#pb').innerHTML=h;$('#pop').hidden=false}
/* панель репетитора с уточняющими вопросами */
let PH=[],PS='',PW=false,LW=null;
async function tutor(sys,q,w){PS=sys;PH=[{role:'user',content:q}];PW=!!w;pop('Думаю…');await reply()}
async function reply(){try{PH.push({role:'assistant',content:await ai(PS,PH)});showPop()}catch(e){pop('⚠️ '+esc(e.message))}}
function showPop(){pop(PH.map((m,i)=>i==0&&m.role=='user'?'':`<div class="${m.role=='user'?'m':''}">${md(m.content)}</div>`).join('<hr>')+`<input id="fq" placeholder="Спроси ещё про это…" onkeydown="if(event.key=='Enter')more()"><button onclick="more()">Спросить</button> ${PW?'<button class="a" onclick="saveW()">+ в колоду</button>':''}`)}
function more(){const q=$('#fq').value.trim();if(!q)return;PH.push({role:'user',content:q});pop('Думаю…');reply()}
function saveW(){const a=PH.find(m=>m.role=='assistant');S.deck[LW.w]={ctx:LW.ctx,tr:a?a.content:'',b:0,n:0};sv();gain(3);$('#pb').insertAdjacentHTML('beforeend','<div class="m">Добавлено в колоду ✅</div>')}
function askTopic(){const t=Q.t+(Q.cur?'. Вопрос: '+Q.cur:'');PS=TS+' Тема: '+Q.t;PH=[];PW=false;showPop()}
/* смотреть */
let L=[],cur=-1,LP=null,STOP=null,M={k:0};
const now=()=>M.k=='yt'?M.yt.getCurrentTime():$('#vid').currentTime;
const seek=t=>M.k=='yt'?M.yt.seekTo(t,true):($('#vid').currentTime=t);
const play=()=>M.k=='yt'?M.yt.playVideo():$('#vid').play();
const pause=()=>M.k=='yt'?M.yt.pauseVideo():$('#vid').pause();
const rate=r=>M.k=='yt'?M.yt.setPlaybackRate(r):($('#vid').playbackRate=r);
const ytId=u=>{const m=u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/);return m&&m[1]};
const ytApi=()=>new Promise(ok=>{if(window.YT&&YT.Player)return ok();window.onYouTubeIframeAPIReady=ok;const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s)});
async function ytLoad(){const id=ytId($('#url').value);if(!id)return alert('Не вижу ссылку на YouTube');
 $('#stage').innerHTML='<div id="yt"></div>';M.k='yt';await ytApi();M.yt=new YT.Player('yt',{videoId:id,playerVars:{playsinline:1,cc_load_policy:0}});
 $('#tr').innerHTML='<div class="c">✅ Видео загружено. Теперь добавь субтитры: на YouTube «Ещё» → «Посмотреть расшифровку», скопируй текст с временем, вставь в поле выше и нажми «Разобрать текст».</div>'}
$('#fv').onchange=e=>{const f=e.target.files[0];if(!f)return;M.k='v';$('#stage').innerHTML='<video id="vid" controls playsinline></video>';$('#vid').src=URL.createObjectURL(f)};
$('#fs').onchange=async e=>{const f=e.target.files[0];if(f)setLines(parse(await f.text()))};
function parse(t){t=t.replace(/\r/g,'');const out=[],re=/(?:(\d+):)?(\d+):(\d+)[.,](\d+)\s*-->\s*(?:(\d+):)?(\d+):(\d+)[.,](\d+)[^\n]*\n([\s\S]*?)(?=\n\s*\n|$)/g,T=(h,m,s,f)=>(+h||0)*3600+m*60+ +s+ +('0.'+f);let m;
 while(m=re.exec(t)){const x=m[9].replace(/<[^>]+>/g,'').replace(/\n/g,' ').trim();if(x)out.push({s:T(m[1],m[2],m[3],m[4]),e:T(m[5],m[6],m[7],m[8]),t:x})}return out}
function parseYT(t){const out=[];let c=null;for(const l of t.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean)){const m=l.match(/^(?:(\d+):)?(\d{1,2}):(\d{2})(?:\s+(.*))?$/);if(m){if(c&&c.t)out.push(c);c={s:(+m[1]||0)*3600+m[2]*60+ +m[3],t:m[4]||''}}else if(c)c.t+=(c.t?' ':'')+l}if(c&&c.t)out.push(c);out.forEach((x,i)=>x.e=out[i+1]?out[i+1].s:x.s+4);return out}
function usePaste(){const t=$('#paste').value;if(!t.trim())return;let a=parse(t);if(!a.length)a=parseYT(t);if(!a.length)a=(t.replace(/\s+/g,' ').match(/[^.!?]+[.!?]*/g)||[]).map(x=>({s:null,e:null,t:x.trim()})).filter(x=>x.t);setLines(a)}
function setLines(a,auto){if(auto&&a.length){const d=a.map(x=>x.e-x.s).sort((p,q)=>p-q)[a.length>>1];if(d>50)a=a.map(x=>({s:x.s/1000,e:x.e/1000,t:x.t}))}
 a.forEach(x=>x.t=dec(dec(x.t)).replace(/\s+/g,' '));L=a;cur=-1;LP=null;render()}
function render(){$('#tr').innerHTML=L.map((l,i)=>`<div class="ln" id="l${i}" onclick="sel(${i})"><span class="m">${l.s!=null?fmt(l.s):'¶'}</span> ${l.t.split(/(\s+)/).map(w=>/\S/.test(w)?`<span class="w" onclick="word(event,${i})">${esc(w)}</span>`:w).join('')}<div class="act">${l.s!=null?`<button class="a" onclick="playLine(${i})">▶</button><button class="a" onclick="loopLine(${i})">🔁</button>`:''}<button class="a" onclick="shadow(${i})">🎤</button><button class="a" onclick="lineTr(${i})">🇷🇺</button><button class="a" onclick="explain(${i})">🧠</button><button class="a" onclick="say(L[${i}].t)">🔊</button></div></div>`).join('');$('#ctl').hidden=false}
function sel(i){document.querySelectorAll('.ln').forEach(x=>x.classList.remove('on'));const e=$('#l'+i);if(e)e.classList.add('on');cur=i;cap(i)}
function cap(i){const e=$('#cap');if(!e||!L[i])return;e.innerHTML=L[i].t.split(/(\s+)/).map(w=>/\S/.test(w)?`<span class="w" onclick="word(event,${i})">${esc(w)}</span>`:w).join('')}
function playLine(i){seek(L[i].s);play();STOP=L[i].e;LP=null}
function loopLine(i){LP=LP===i?null:i;if(LP!=null){seek(L[i].s);play()}}
function word(ev,i){ev.stopPropagation();const w=ev.target.textContent.replace(/[^\w']/g,'');if(!w)return;try{pause()}catch(e){}wordInfo(w,L[i].t)}
async function wordInfo(w,ctx){const key=w.toLowerCase().replace(/[^a-z]/g,'');pop('Ищу…');let tr='',ph='',def='';
 try{tr=(await(await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(key)+'&langpair=en|ru')).json()).responseData.translatedText}catch(e){}
 try{const x=(await(await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+key)).json())[0];ph=x.phonetic||((x.phonetics||[]).find(p=>p.text)||{}).text||'';def=x.meanings.slice(0,2).map(m=>'<i>'+esc(m.partOfSpeech)+'</i>: '+esc(m.definitions[0].definition)).join('<br>')}catch(e){}
 LW={w:key,ctx,tr};
 pop(`<h3>${esc(w)} <span class="m">${esc(ph)}</span></h3><div>🇷🇺 ${esc(tr)||'—'}</div><div class="m">${def}</div><div class="m">Это перевод слова без контекста.</div><button onclick="say('${key}')">🔊</button> <button onclick="saveW()">+ в колоду</button> <button class="a" onclick="askClaude('Объясни слово «'+LW.w+'» в этом предложении: '+LW.ctx)">Спросить Клода</button>`)}
function saveW(){S.deck[LW.w]={ctx:LW.ctx,tr:LW.tr,b:0,n:0};sv();gain(3);$('#pb').insertAdjacentHTML('beforeend','<div class="m">Добавлено в колоду ✅</div>')}
function askClaude(q){const p=ES+'\n\n'+q;try{navigator.clipboard.writeText(p)}catch(e){}pop('Открываю Claude. Если вопрос не появился, просто вставь его (он скопирован) и отправь.');window.open('https://claude.ai/new?q='+encodeURIComponent(p),'_blank')}
function explain(i){const c=[L[i-1],L[i],L[i+1]].filter(Boolean).map(x=>x.t).join(' | ');askClaude('Разбери строку из видео: '+L[i].t+'\nКонтекст: '+c)}
async function lineTr(i){pop('Перевожу…');try{const r=await(await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(L[i].t)+'&langpair=en|ru')).json();pop('<div>'+esc(L[i].t)+'</div><h3>'+esc(r.responseData.translatedText)+'</h3><div class="m">Машинный перевод, может быть неточным.</div><button class="a" onclick="explain('+i+')">Разбор в Claude</button>')}catch(e){pop('Не получилось перевести')}}
function shadow(i){try{pause()}catch(e){}pop('🎤 Говори…');mic(h=>{h=norm(h);const tw=norm(L[i].t).split(' '),hs=new Set(h.split(' ')),pc=Math.round(tw.filter(w=>hs.has(w)).length/tw.length*100);
 pop(`<h3>${pc}% совпало</h3>${tw.map(w=>`<span style="color:${hs.has(w)?'var(--l)':'var(--r)'}">${w}</span>`).join(' ')}<div class="m">Услышала: ${esc(h)}</div><button onclick="shadow(${i})">Ещё раз</button> <button class="a" onclick="explain(${i})">🧠 Как это звучит</button>`);gain(pc>=70?10:3)})}
setInterval(()=>{if(!L.length||L[0].s==null||!M.k)return;let t;try{t=now()}catch(e){return}
 if(STOP!=null&&t>=STOP){pause();STOP=null}if(LP!=null&&t>=L[LP].e)seek(L[LP].s);
 const i=L.findIndex(l=>t>=l.s&&t<l.e);if(i>=0&&i!=cur){sel(i);$('#l'+i).scrollIntoView({block:'nearest',behavior:'smooth'})}},250);
/* грамматика */
let Q={};
function gramHome(){$('#gram').innerHTML='<div class="c"><b>Грамматика с нуля</b><div class="m">Выбери тему: подробный урок создаётся и сохраняется. Потом 7 вопросов и проверка твоих предложений.</div></div><div class="c">'+TOP.map((t,i)=>`<button class="${S.les[t]?'':'a'}" onclick="lesson(${i})">${t}${S.les[t]&&S.les[t].done?' ✅':''}</button>`).join(' ')+'</div>'}
async function lesson(i){const t=TOP[i];let d=S.les[t];if(!d){$('#gram').innerHTML='<div class="c">Готовлю подробный урок… 15–30 секунд</div>';
 try{d=JSON.parse((await ai(GS,[{role:'user',content:'Тема: '+t}])).replace(/```json|```/g,'').trim());S.les[t]=d;sv()}catch(e){$('#gram').innerHTML='<div class="c">⚠️ Не вышло, попробуй ещё раз.</div><button onclick="gramHome()">Назад</button>';return}}
 Q={t,d,i:0,ok:0,cur:''};showLesson()}
function showLesson(){const{t,d}=Q;$('#gram').innerHTML=`<div class="c"><button class="a" onclick="gramHome()">← Темы</button><h2>${t}</h2><div>${md(d.rule)}</div></div><div class="c"><b>Примеры</b>${d.examples.map(e=>`<div>${esc(e[0])} <button class="a" data-t="${esc(e[0])}" onclick="say(this.dataset.t)">🔊</button><div class="m">${esc(e[1])}</div></div>`).join('')}</div><div class="c"><b>Частые ошибки</b>${d.mistakes.map(m=>'<div>⚠️ '+md(m)+'</div>').join('')}</div><button onclick="Q.i=0;Q.ok=0;qz()">Проверить себя</button> <button class="a" onclick="askTopic()">🤖 Спросить про тему</button>`}
function qz(a){const d=Q.d;if(Q.i>=d.quiz.length)return fin();const q=d.quiz[Q.i];Q.cur=q.q;

function parse(t){t=t.replace(/\r/g,'');const out=[],re=/(?:(\d+):)?(\d+):(\d+)[.,](\d+)\s*-->\s*(?:(\d+):)?(\d+):(\d+)[.,](\d+)[^\n]*\n([\s\S]*?)(?=\n\s*\n|$)/g,T=(h,m,s,f)=>(+h||0)*3600+m*60+ +s+ +('0.'+f);let m;
 while(m=re.exec(t)){const x=m[9].replace(/<[^>]+>/g,'').replace(/\n/g,' ').trim();if(x)out.push({s:T(m[1],m[2],m[3],m[4]),e:T(m[5],m[6],m[7],m[8]),t:x})}return out}
